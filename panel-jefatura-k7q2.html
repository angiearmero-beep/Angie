<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Valkyria Squad — Panel general</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f172a; --bg-soft:#162033; --panel:#1e293b; --panel-2:#273449; --line:#334155;
    --accent:#5b9bd5; --accent-soft:#9cc3eb; --muted:#7d93b8;
    --text:#e2e8f0; --text-dim:#94a3b8;
    --green:#3fa872; --amber:#d6a24b; --red:#d64545; --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{ background: radial-gradient(circle at 15% 0%, #1c2a44 0%, var(--bg) 55%); color:var(--text); font-family:'Manrope',sans-serif; min-height:100vh; padding-bottom:60px; }
  a{ color:var(--accent-soft); text-decoration:none; } a:hover{ text-decoration:underline; }
  .hero{ padding:28px 6vw 30px; border-bottom:1px solid var(--line); }
  .crumb{ font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-dim); margin-bottom:12px; }
  .hero h1{ font-weight:800; font-size:clamp(26px,3.6vw,38px); color:var(--accent-soft); letter-spacing:-.01em; }
  .hero p{ margin-top:6px; color:var(--text-dim); font-size:14.5px; }
  .wrap{ padding:32px 6vw 0; max-width:1180px; margin:0 auto; }
  .section-title{ font-weight:700; font-size:14px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-soft); margin:36px 0 16px; display:flex; align-items:center; gap:10px; }
  .section-title::after{ content:""; flex:1; height:1px; background:var(--line); }
  .section-title:first-child{ margin-top:0; }

  .kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  @media (max-width:900px){ .kpis{ grid-template-columns:1fr 1fr; } }
  @media (max-width:560px){ .kpis{ grid-template-columns:1fr; } }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:20px; }
  .card .lb{ font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-dim); margin-bottom:10px; }
  .card .v{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:28px; }
  .card .s{ font-size:12.5px; color:var(--text-dim); margin-top:6px; line-height:1.5; }
  .g{ color:var(--green);} .a{ color:var(--amber);} .r{ color:var(--red);} .ac{ color:var(--accent-soft);}

  .tw{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); min-width:760px; }
  th,td{ padding:12px 14px; text-align:left; font-size:13px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th{ background:var(--panel-2); color:var(--accent-soft); font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; }
  td.n{ font-family:'JetBrains Mono',monospace; }
  tr.sub td{ background:rgba(91,155,213,.07); font-weight:600; }
  tr.dim td{ color:var(--text-dim); }
  .warn{ color:var(--amber); cursor:help; }
  .chip{ display:inline-block; min-width:52px; text-align:center; padding:3px 8px; border-radius:100px; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px; }
  .chip.g{ background:rgba(63,168,114,.16); color:var(--green); }
  .chip.a{ background:rgba(214,162,75,.16); color:var(--amber); }
  .chip.r{ background:rgba(214,69,69,.16); color:var(--red); }
  .chip.x{ background:var(--bg-soft); color:var(--text-dim); }
  .bar{ height:8px; border-radius:6px; background:var(--bg-soft); min-width:120px; overflow:hidden; }
  .bar i{ display:block; height:100%; border-radius:6px; }
  .sem{ display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:700; }
  .sem b{ width:9px; height:9px; border-radius:50%; background:currentColor; display:inline-block; }

  .notes{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px 22px; margin-top:16px; font-size:13px; line-height:1.65; }
  .notes b{ color:var(--accent-soft); }
  .notes ol{ margin:8px 0 0 18px; } .notes li{ margin-bottom:6px; }
  .ins{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  @media (max-width:760px){ .ins{ grid-template-columns:1fr; } }
  .in{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; font-size:13.5px; line-height:1.55; }
  .in .ic{ margin-right:6px; }
  footer{ text-align:center; color:var(--text-dim); font-size:11.5px; padding:26px 6vw; }

  .lock{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .lock-card{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:34px 32px; width:100%; max-width:380px; text-align:center; }
  .lock-card .ic{ font-size:34px; margin-bottom:10px; }
  .lock-card h1{ font-weight:800; font-size:22px; color:var(--accent-soft); margin-bottom:6px; }
  .lock-card p{ font-size:13px; color:var(--text-dim); margin-bottom:20px; line-height:1.55; }
  .lock-card input{ width:100%; background:var(--bg-soft); border:1px solid var(--line); border-radius:10px; padding:13px 14px; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:16px; text-align:center; letter-spacing:.12em; outline:none; }
  .lock-card input:focus{ border-color:var(--accent); }
  .lock-card button{ width:100%; margin-top:12px; background:var(--accent); color:#0b1220; border:none; border-radius:10px; padding:13px; font-weight:700; font-size:14px; cursor:pointer; font-family:'Manrope',sans-serif; }
  .lock-card button:disabled{ opacity:.6; cursor:wait; }
  .lock-err{ color:var(--red); font-size:12.5px; margin-top:12px; min-height:18px; }
  .lock-back{ display:inline-block; margin-top:8px; font-size:13px; color:var(--text-dim); }
</style>
</head>
<body>
<div class="lock" id="lock">
  <div class="lock-card">
    <div class="ic">🔒</div>
    <h1>Vista de jefatura</h1>
    <p>Este panel está cifrado. Ingresá el código de acceso para verlo.</p>
    <input id="code" type="password" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autofocus>
    <button id="go">Entrar</button>
    <div class="lock-err" id="err"></div>
    <a class="lock-back" href="equipo.html">← Volver al equipo</a>
  </div>
</div>
<div id="app"></div>

  const ITER = 600000;
  const norm = s => s.toUpperCase().replace(/[^A-Z0-9]/g, '');

  async function decryptPanel(code){
    const raw = Uint8Array.from(atob(BLOB), c => c.charCodeAt(0));
    const salt = raw.slice(0, 16), iv = raw.slice(16, 28), data = raw.slice(28);
    const mat = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(code)), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256' }, mat, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, data);
    return JSON.parse(new TextDecoder().decode(plain));
  }

  async function unlock(code, silent){
    const err = document.getElementById('err'), btn = document.getElementById('go');
    if (!window.crypto || !crypto.subtle){ err.textContent = 'Este navegador no permite descifrar (se necesita https).'; return; }
    btn.disabled = true; err.textContent = silent ? '' : 'Verificando…';
    try {
      const p = await decryptPanel(code);
      try { sessionStorage.setItem('vk_jef', norm(code)); } catch(e){}
      document.getElementById('lock').style.display = 'none';
      document.getElementById('app').innerHTML = p.html;
      const s = document.createElement('script'); s.textContent = p.js; document.body.appendChild(s);
    } catch(e){
      try { sessionStorage.removeItem('vk_jef'); } catch(_){}
      err.textContent = silent ? '' : 'Código incorrecto.';
      btn.disabled = false;
    }
  }
  document.getElementById('go').addEventListener('click', () => unlock(document.getElementById('code').value, false));
  document.getElementById('code').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(e.target.value, false); });
  try { const saved = sessionStorage.getItem('vk_jef'); if (saved) unlock(saved, true); } catch(e){}
